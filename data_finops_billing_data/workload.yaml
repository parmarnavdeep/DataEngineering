apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing-demo
  template:
    metadata:
      labels:
        app: billing-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: demo
          image: docker.io/library/busybox:1.37
          command: ["sleep", "86400"]
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 128Mi
